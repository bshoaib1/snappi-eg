name: Publish Snappi coming soon
on:
  push:
    branches: [main]
    paths:
      - snappi-coming-soon-site.zip
      - .github/workflows/coming-soon.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare holding page
        run: mkdir -p _site && unzip -q snappi-coming-soon-site.zip -d _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
